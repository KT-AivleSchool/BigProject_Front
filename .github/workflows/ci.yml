name: Frontend CI (Next.js)

# 🔴 `main_deploy` 가 빠져 있었다(2026-08-14). **배포되는 브랜치가 유일하게
#    검사를 안 받는** 상태였다 — 여기로 밀면 Amplify 웹훅이 바로 빌드를 잡는데
#    lint·build 는 한 번도 안 돌았다. 그래서 깨진 것을 AWS 콘솔에서야 알게 된다
#    (GitHub Actions 에는 배포 잡이 없어서 이 화면에는 아무것도 안 뜬다).
on:
  push:
    branches: [ main, main_deploy, develop ]
  pull_request:
    branches: [ main, main_deploy, develop ]

jobs:
  build-test:
    name: Lint and Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: false

    - name: Run Next.js Build
      run: npm run build
      env:
        # 빌드 도중 필요한 환경 변수가 있을 시 주입
        NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        NEXT_PUBLIC_API_URL: http://localhost:8000
